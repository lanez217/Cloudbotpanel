<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ CloudBot Panel Pro</title>
<script src="/socket.io/socket.io.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.12);
        --accent-glow: #6366f1;
        --accent-gold: #f59e0b;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --danger-color: #ef4444;
        --success-color: #10b981;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
        background: var(--bg-gradient);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    /* Header Styling */
    .header { text-align: center; }
    .header h1 {
        font-size: 28px;
        font-weight: 800;
        background: linear-gradient(90deg, #818cf8, #c084fc, #f59e0b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.5px;
    }
    .header p { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }

    /* Glass Cards */
    .card {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    /* Stats Section */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .stat-box {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 16px;
        text-align: center;
    }
    .stat-box h2 { font-size: 32px; font-weight: 700; color: #a7f3d0; margin-bottom: 2px; }
    .stat-box p { color: var(--text-secondary); font-size: 13px; font-weight: 500; }

    /* Forms & Inputs */
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500; }
    
    input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--glass-border);
        background: rgba(0, 0, 0, 0.2);
        color: var(--text-primary);
        font-size: 15px;
        outline: none;
        transition: all 0.3s ease;
    }
    input:focus {
        border-color: var(--accent-glow);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    /* Buttons */
    .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .btn-primary {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        color: #fff;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); opacity: 0.95; }
    
    .btn-danger {
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.3);
        margin-top: 12px;
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }

    /* Output Displays */
    .status-badge {
        font-size: 13px;
        padding: 8px 12px;
        border-radius: 8px;
        text-align: center;
        margin: 12px 0;
        display: none;
        background: rgba(255, 255, 255, 0.05);
    }

    .qr-container {
        display: none;
        text-align: center;
        margin: 20px 0;
        padding: 15px;
        background: #fff;
        border-radius: 16px;
    }
    .qr-container img { width: 180px; height: 180px; display: block; margin: 0 auto; }

    .code-container {
        display: none;
        text-align: center;
        margin: 20px 0;
        padding: 16px;
        background: rgba(99, 102, 241, 0.1);
        border: 1px dashed var(--accent-glow);
        border-radius: 16px;
    }
    .code-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
    .code-value {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 4px;
        color: var(--accent-gold);
        margin-top: 4px;
        font-family: monospace;
    }

    /* How to Use Section */
    .steps { list-style: none; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
    .steps li { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--text-secondary); }
    .step-num {
        width: 24px;
        height: 24px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-primary);
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⚡ CLOUDBOT PANEL</h1>
        <p>Manage & Connect your WhatsApp bot instances</p>
    </div>

    <!-- Stats -->
    <div class="card">
        <div class="stats">
            <div class="stat-box">
                <h2 id="bots">0</h2>
                <p>Active Bots</p>
            </div>
            <div class="stat-box">
                <h2 id="users">0</h2>
                <p>Total Users</p>
            </div>
        </div>
    </div>

    <!-- Connection Form -->
    <div class="card">
        <div class="input-group">
            <label for="phone">WhatsApp Phone Number</label>
            <input type="tel" id="phone" placeholder="e.g. 2348123456789">
        </div>

        <button class="btn btn-primary" onclick="connectBot()">Connect Instance</button>

        <div id="status" class="status-badge"></div>

        <!-- Pairing Displays -->
        <div id="qr" class="qr-container"></div>
        <div id="code" class="code-container">
            <div class="code-label">Your Pairing Code</div>
            <div id="code-val" class="code-value">------</div>
        </div>

        <button class="btn btn-danger" onclick="disconnectBot()">Disconnect Bot</button>
    </div>

    <!-- Instructions -->
    <div class="card">
        <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 8px;">Quick Setup Guide</h3>
        <ul class="steps">
            <li><span class="step-num">1</span> Enter WhatsApp number with country code</li>
            <li><span class="step-num">2</span> Scan the QR code or copy the pairing code</li>
            <li><span class="step-num">3</span> Paste in WhatsApp → Linked Devices</li>
        </ul>
    </div>
</div>

<script>
const socket = io();
const userId = 'user_' + Math.random().toString(36).substr(2,9);

function setStatus(message) {
    const statusEl = document.getElementById('status');
    statusEl.style.display = 'block';
    statusEl.innerText = message;
}

function connectBot() {
    const phone = document.getElementById('phone').value.trim();
    if(!phone) {
        setStatus('⚠️ Please enter a valid phone number');
        return;
    }
    setStatus('Initializing connection...');
    socket.emit('connect_bot', { userId, phone });
}

function disconnectBot() {
    socket.emit('disconnect_bot', { userId });
}

// Socket Events
socket.on('status', msg => setStatus(msg));

socket.on('qr', qr => {
    const qrContainer = document.getElementById('qr');
    qrContainer.style.display = 'block';
    qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qr)}">`;
});

socket.on('pairing_code', code => {
    const codeContainer = document.getElementById('code');
    const codeVal = document.getElementById('code-val');
    codeContainer.style.display = 'block';
    codeVal.innerText = code;
});

socket.on('connected', () => {
    setStatus('✅ Instance Connected Successfully!');
    document.getElementById('qr').style.display = 'none';
});

socket.on('disconnected', () => {
    setStatus('❌ Instance Disconnected');
    document.getElementById('qr').style.display = 'none';
    document.getElementById('code').style.display = 'none';
});

// Update Live Stats
setInterval(async () => {
    try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        document.getElementById('bots').innerText = data.botsOnline;
        document.getElementById('users').innerText = data.totalUsers;
    } catch(err) {
        console.error('Stats fetch failed');
    }
}, 3000);
</script>
</body>
           </html>
