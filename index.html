<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanez View Once Unlock 🔓</title>

<!-- Open Graph Meta Tags for WhatsApp Link Sharing -->
<meta property="og:title" content="Lanez XMD — View Once Unlock & Pairing Portal">
<meta property="og:description" content="Unlock View Once media securely and connect your device instantly with Lanez OS.">
<meta property="og:type" content="website">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');
*{font-family:'Inter',sans-serif;box-sizing:border-box}
body{
  background:radial-gradient(circle at center,#1a2f35 0%,#0b141a 55%,#050a0f 100%);
  color:#e9edef;margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden
}
.funk-lights{
  position:fixed;inset:0;
  background:linear-gradient(45deg,#00a884,#00f5ff,#ff00ff,#ffcc00);
  background-size:400% 400%;animation:funkBg 4s infinite ease-in-out;
  opacity:.15;pointer-events:none;z-index:1
}
@keyframes funkBg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.flash-overlay{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:99}
.flash-overlay.active{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.card{
  position:relative;z-index:2;background:rgba(22,33,40,.9);backdrop-filter:blur(24px);
  width:92%;max-width:400px;padding:32px;border-radius:28px;
  border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 80px rgba(0,0,0,.7);
  text-align:center;animation:slideUp .8s cubic-bezier(.16,1,.3,1),cardBounce 1.2s infinite ease-in-out 0.8s
}
@keyframes slideUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.lens{
  width:72px;height:72px;margin:0 auto 12px;
  background:radial-gradient(circle at 30% 30%,#3a4d55,#111b21);
  border-radius:50%;border:3px solid #00a884;display:grid;place-items:center;font-size:32px;
  box-shadow:0 0 0 8px rgba(0,168,132,.12),0 0 40px rgba(0,168,132,.3);
  animation:lensPulse 2s infinite,danceShake .6s infinite ease-in-out
}
@keyframes lensPulse{0%,100%{box-shadow:0 0 0 8px rgba(0,168,132,.12),0 0 40px rgba(0,168,132,.3)}50%{box-shadow:0 0 0 14px rgba(0,168,132,.08),0 0 60px rgba(0,168,132,.5)}}
@keyframes danceShake{0%{transform:rotate(-8deg) scale(1)}25%{transform:rotate(8deg) scale(1.05)}50%{transform:rotate(-6deg) scale(1)}75%{transform:rotate(6deg) scale(1.05)}100%{transform:rotate(-8deg) scale(1)}}
h2{margin:8px 0 4px;font-weight:800;font-size:22px;letter-spacing:-.5px}
.sub{color:#8696a0;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:22px}
.stat{background:#0d171d;border-radius:14px;padding:10px 4px;border:1px solid rgba(255,255,255,.05)}
.stat b{display:block;font-size:13px;color:#00a884}
.stat span{font-size:9px;color:#5a6b75;text-transform:uppercase;letter-spacing:1px}

input{width:100%;background:#0d171d;border:1px solid rgba(255,255,255,.08);padding:16px;border-radius:16px;color:white;font-size:15px;outline:none;transition:.3s}
input:focus{border-color:#00a884;box-shadow:0 0 0 4px rgba(0,168,132,.15)}
button{width:100%;margin-top:12px;background:#00a884;border:none;padding:16px;border-radius:16px;color:white;font-weight:800;font-size:15px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
button:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,168,132,.4)}
button:active{transform:scale(.97)}

.btn-secondary{background:#111;border:1px solid rgba(255,255,255,.1);font-size:13px;padding:12px}

.dancing-dots{display:flex;justify-content:center;gap:8px;margin:16px 0}
.dancing-dots span{width:8px;height:8px;background:#00a884;border-radius:50%;display:inline-block;animation:dotBounce .6s infinite alternate}
.dancing-dots span:nth-child(2){animation-delay:.1s}.dancing-dots span:nth-child(3){animation-delay:.2s}
@keyframes dotBounce{from{transform:translateY(0);opacity:.5}to{transform:translateY(-10px);opacity:1}}

.code-box{margin-top:18px;background:#050a0f;padding:22px;border-radius:16px;font-size:26px;letter-spacing:6px;font-weight:800;display:none;border:1px dashed #00a884;color:#00a884;cursor:pointer}
.shutter{animation:shutter .5s cubic-bezier(.16,1,.3,1)}
@keyframes shutter{0%{transform:scale(.5) rotate(-5deg);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

.footer{margin-top:24px;font-size:11px;color:#4a5a65;line-height:1.6}
.footer b{color:#8aa0ad}
</style>
</head>
<body>
<div class="funk-lights"></div>
<div id="flash" class="flash-overlay"></div>

<div class="card">
  <div class="lens">📸</div>
  <h2>Lanez View Once Unlock 🔓</h2>
  <div class="sub">Secure Pairing • Encrypted</div>
  
  <div class="stats">
    <div class="stat"><b id="servers">--</b><span>Nodes</span></div>
    <div class="stat"><b id="uptime">--</b><span>Uptime</span></div>
    <div class="stat"><b id="speed">--</b><span>Ping</span></div>
    <div class="stat"><b id="visitors">--</b><span>Views</span></div>
  </div>

  <input id="num" placeholder="e.g. 23359..." type="number" />
  <button id="btn" onclick="getCode()">Get Pair Code</button>
  
  <div class="dancing-dots"><span></span><span></span><span></span></div>
  
  <div id="code" class="code-box" onclick="copyCode()"></div>
  
  <button class="btn-secondary" onclick="toggleFunk()">🎶 Toggle Funk Track</button>
  <button class="btn-secondary" onclick="shareSite()" style="margin-top:6px;">🔗 Share Portal</button>
  
  <div class="footer">Crafted with 🖤 by <b>Lanez XMD</b><br>© 2026 Lanez Team — All Rights Reserved</div>
</div>

<audio id="shutterSound" preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_d1718ab41b.mp3" type="audio/mpeg">
</audio>
<audio id="funk" loop preload="auto">
  <source src="/audio/funk.mp3" type="audio/mpeg">
</audio>

<script>
const $ = id => document.getElementById(id);

async function loadStats(){
  try{
    const startTime = performance.now();
    const r = await fetch('/api/stats').then(x=>x.json()).catch(()=>null);
    const latency = Math.round(performance.now() - startTime);

    if(r){
      $('servers').innerText = r.servers;
      $('uptime').innerText = r.uptime;
      $('speed').innerText = latency + 'ms';
      $('visitors').innerText = r.visitors || 0;
    } else {
      $('servers').innerText = 'Offline';
      $('uptime').innerText = '0m';
      $('speed').innerText = '--';
      $('visitors').innerText = '--';
    }
  }catch{}
}

function triggerFlash(){
  const f = $('flash'), s = $('shutterSound');
  f.classList.remove('active'); void f.offsetWidth; f.classList.add('active');
  s.currentTime = 0; s.play().catch(()=>{});
  if(navigator.vibrate) navigator.vibrate(80);
}

function toggleFunk(){
  const a = $('funk');
  if(a.paused) {
    a.play().catch(()=>alert('Tap again to play audio'));
  } else {
    a.pause();
  }
}

function shareSite(){
  if (navigator.share) {
    navigator.share({
      title: 'Lanez XMD Pairing Portal',
      url: window.location.href
    }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert('Link copied to clipboard!');
  }
}

async function getCode(){
  const num = $('num').value.trim();
  const codeEl = $('code');
  const btn = $('btn');
  if(!num) return alert('Please enter your phone number');

  triggerFlash();
  btn.innerText = 'Generating...';
  btn.disabled = true;

  try{
    const resp = await fetch('/pair', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ number: num })
    }).then(r => r.json());

    if(resp.code) {
      codeEl.innerText = resp.code;
      codeEl.style.display = 'block';
      codeEl.classList.remove('shutter');
      void codeEl.offsetWidth;
      codeEl.classList.add('shutter');
      
      navigator.clipboard.writeText(resp.code.replace(/-/g, ''));
      btn.innerText = 'COPIED TO CLIPBOARD ✅';
      setTimeout(() => { btn.innerText = 'Get Pair Code'; btn.disabled = false; }, 3000);
    } else {
      alert(resp.error || 'Failed to generate code');
      btn.innerText = 'Get Pair Code';
      btn.disabled = false;
    }
  }catch(err){
    alert('Server connection error. Please try again.');
    btn.innerText = 'Get Pair Code';
    btn.disabled = false;
  }
}

function copyCode(){
  const codeText = $('code').innerText.replace(/-/g, '');
  if(!codeText) return;
  navigator.clipboard.writeText(codeText);
  const orig = $('code').innerText;
  $('code').innerText = 'COPIED!';
  setTimeout(() => $('code').innerText = orig, 1000);
  if(navigator.vibrate) navigator.vibrate(50);
}

loadStats();
setInterval(loadStats, 4000);
</script>
</body>
</html>
